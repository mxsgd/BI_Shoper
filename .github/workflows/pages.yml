name: Deploy demo to GitHub Pages

# Builds a backend-less demo: seeds the synthetic store into a throwaway Postgres, freezes every API
# response the UI can request into JSON, and ships the React app + those files as a static site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bi_shoper_demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Seed the synthetic store (RAW -> CORE pipeline)
        run: python -m app.demo --database-url "$DATABASE_URL"
        working-directory: backend
      - name: Freeze API responses to JSON
        run: python -m app.demo.snapshot --database-url "$DATABASE_URL"
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: analytics-embed/package-lock.json
      - run: npm ci
        working-directory: analytics-embed
      - name: Build the static demo
        run: npm run build:demo
        working-directory: analytics-embed

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: analytics-embed/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
